name: Dark Anime AI Lab — safe checks

on:
  push:
    branches:
      - lab/premium-wallpaper-engine
    paths:
      - "ai-lab/**"
      - ".github/workflows/ai-lab-check.yml"

permissions:
  contents: read

concurrency:
  group: dark-anime-ai-lab-checks
  cancel-in-progress: true

jobs:
  validate:
    name: Unit tests and quota-safe generation plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lab-only requirements
        run: python -m pip install --disable-pip-version-check -r ai-lab/requirements.txt
      - name: Run tests (no external API calls)
        run: python -m unittest discover -s ai-lab/tests -v
      - name: Produce quality benchmark plan without generating images
        run: python ai-lab/lab.py plan --model klein --count 3
      - name: Upload reviewable lab plan (no website changes)
        uses: actions/upload-artifact@v4
        with:
          name: dark-anime-lab-plan
          path: ai-lab/out/plan.json
          retention-days: 7
